name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - run: gradle :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: BackdropCam-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Publish APK as a GitHub Release (easy download on phones)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk BackdropCam.apk
          # Release name = the app's own version, so the page and the app always match. A fixed
          # versionName (e.g. "1.0.47" on release/v1) is used as is; otherwise 1.0.<build number>.
          VERSION=$(grep -oP 'versionName = "\K[0-9.]+(?=")' app/build.gradle.kts || true)
          [ -z "$VERSION" ] && VERSION="1.0.${{ github.run_number }}"
          TAG="v$VERSION"
          # GitHub's release API sometimes returns a temporary 500; retry a few times.
          for attempt in 1 2 3 4; do
            gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
            if gh release create "$TAG" BackdropCam.apk \
                --target "${{ github.sha }}" \
                --prerelease \
                --title "BackdropCam $VERSION (${{ github.ref_name }})" \
                --notes "Version $VERSION from ${{ github.ref_name }}, commit ${{ github.sha }}. Download BackdropCam.apk and install it."; then
              exit 0
            fi
            echo "Release attempt $attempt failed, retrying"
            sleep $((attempt * 20))
          done
          exit 1
