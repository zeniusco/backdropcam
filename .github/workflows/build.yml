name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - run: gradle :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: BackdropCam-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Publish APK as a GitHub Release (easy download on phones)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk BackdropCam.apk
          TAG="build-${{ github.run_number }}"
          gh release create "$TAG" BackdropCam.apk \
            --target "${{ github.sha }}" \
            --prerelease \
            --title "BackdropCam build ${{ github.run_number }} (${{ github.ref_name }})" \
            --notes "Debug build from ${{ github.ref_name }}, commit ${{ github.sha }}. Download BackdropCam.apk and install it."
